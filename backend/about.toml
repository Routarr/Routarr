# What `cargo about generate` writes into the image's third-party notices
# (`Dockerfile`, the `notices` stage). The licences accepted are deny.toml's
# allow-list, which `scripts/check-licences.py` holds this list to.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "GPL-3.0-only",
  "Unlicense",
  "MIT-0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]

# The two platforms the image is built for, so both architectures ship the
# same notices.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]

# What the binary links, and nothing that only builds or tests it.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Routarr itself, whose licence the notices name in their header.
private = { ignore = true }
