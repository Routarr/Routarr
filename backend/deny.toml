# What `cargo deny check` holds the dependency graph to, in CI and locally,
# the one gate on the crates: a RustSec advisory or an unmaintained crate, a
# licence GPL-3.0-only code cannot ship beside, a crate pulled from a registry
# or a git URL nobody named, and a version yanked after the lockfile pinned it.
#
# Every licence below is permissive and GPL-compatible. A new one fails the
# build and is added here by a person, on purpose, and to `about.toml` with it,
# which `scripts/check-licences.py` holds to this list along with the npm
# packages the interface bundles.

[graph]
all-features = false

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "GPL-3.0-only",
  "Unlicense",
  "MIT-0",
  "CC0-1.0",
  "BSL-1.0",
  "0BSD",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
# The list above names what *may* appear; a licence not yet met is not a fault.
unused-allowed-license = "allow"

[bans]
# Transitive duplicates only, none actionable from here; a warning keeps them
# in view without failing a build over somebody else's lockfile.
multiple-versions = "warn"

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
