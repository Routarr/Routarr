[package]
name = "routarr"
version = "0.1.5"
edition = "2024"
rust-version = "1.98"
description = "Smart media routing engine for Radarr and Sonarr"
license = "GPL-3.0-only"
# Routarr is a server, not a library, and it ships as one OCI image. A crate on
# crates.io would be a second way to install it that nothing tests, and a
# published version cannot be taken back.
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
# default-features off: the defaults pull the macros crate, which links every
# database driver (MySQL included, and its `rsa` RUSTSEC advisory) into a
# project that only ever opens SQLite.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No root-store feature: `rustls` verifies against the **platform's** trust
# store. That is a deliberate choice, not a default we inherited. It means a
# homelab CA signing an internal Arr's certificate is accepted, which a
# compiled-in Mozilla set would refuse. The price is that the roots come from
# the base image rather than from a Routarr release, so `Dockerfile` installing
# `ca-certificates` is load-bearing: an image without it fails every metadata
# call, not just the private ones.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls"] }
# Already built for axum and reqwest. Named here for one question reqwest does
# not answer: whether what came back was HTTP at all (`hyper::Error::is_parse`).
# And the server `listener.rs` builds, HTTP/1 only as axum::serve was here.
hyper = { version = "1", features = ["http1", "server"] }
# The listener axum::serve would be, with the header deadline and the bound on
# open connections it does not expose (`listener.rs`). Already built for axum.
hyper-util = { version = "0.1", features = ["server-graceful", "service", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower-http = { version = "0.7", features = [
    "fs",
    "cors",
    "trace",
    "limit",
    "compression-gzip",
    "request-id",
    # A panicking handler must answer 500 rather than dropping the connection
    # with no response at all (the layer in main.rs).
    "catch-panic",
    # The deadline on a request body sent a byte at a time (`BODY_DEADLINE`).
    "timeout",
]  }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
thiserror = "2"
futures = "0.3"
aes-gcm = { version = "0.11", features = ["zeroize"] }
# Password hashing for the single account of the `forms` mode. Argon2id with
# the crate's own defaults: the parameters that matter are memory and time
# cost, and the RustCrypto defaults track the OWASP recommendation.
argon2 = { version = "0.6", features = ["getrandom", "zeroize"] }
getrandom = "0.4"
base64 = "0.23"
# The client credentials of an OIDC token request are form-encoded before they
# are sent as HTTP Basic (RFC 6749 §2.3.1). Already built for reqwest.
form_urlencoded = "1"
subtle = "2"
sha2 = "0.11"
# Signs the outgoing notification, as Standard Webhooks specifies.
hmac = "0.13"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
# Archives sealed with the backup passphrase, a stream of AES-256-GCM chunks:
# an archive is the whole database, never held in memory to be sealed.
aead-stream = { version = "0.6", features = ["alloc"] }
# The backup passphrase, wiped from memory once used.
zeroize = "1"
# The passphrase `routarr restore` asks for, typed without being shown.
rpassword = "7"
# The API contract: the OpenAPI document `GET /api/v1/openapi.json` serves and
# `openapi/v1.json` pins, derived from the types the handlers return, so the
# document cannot describe a field the code does not send.
utoipa = { version = "6", features = ["preserve_order", "preserve_path_order"] }
# Value folding: a letter and its accent apart, so `Shōgun` and `shogun` are one
# value whether a source wrote the accent composed or not.
unicode-normalization = "0.1"
# The free space of the data folder's disk, on Linux, macOS and Windows alike.
fs4 = { version = "1.1.0", default-features = false }

[dev-dependencies]
http-body-util = "0.1"
# Holds every documented answer the API gives to the schema the contract
# states for it: the field names and the types both.
jsonschema = { version = "0.58", default-features = false }
# `test-util` only: it brings the paused clock the rate-limiter tests need, so
# pacing is asserted in virtual time rather than by actually sleeping through it.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
uninlined_format_args = "allow"

# The cost an archive's key is derived at is made for a release build:
# unoptimised, Argon2 takes seconds where it takes a fraction of one, and the
# tests that seal and open archives wait on it.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
