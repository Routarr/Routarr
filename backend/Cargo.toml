[package]
name = "routarr"
version = "0.1.1"
edition = "2024"
rust-version = "1.98"
description = "Smart media routing engine for Radarr and Sonarr"
license = "GPL-3.0-only"
# Routarr is a server, not a library, and it ships as one OCI image. A crate on
# crates.io would be a second way to install it that nothing tests — and a
# published version cannot be taken back.
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
# default-features off: the defaults pull the macros crate, which links every
# database driver (MySQL included, and its `rsa` RUSTSEC advisory) into a
# project that only ever opens SQLite.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# No root-store feature: reqwest 0.13.2 removed `webpki-roots` and verifies
# against the **platform's** trust store instead. That is a deliberate choice,
# not a default we inherited. It means a homelab CA signing an internal Arr's
# certificate is accepted, which the compiled-in Mozilla set refused; the price
# is that the roots now come from the base image rather than from a Routarr
# release, so `Dockerfile` installing `ca-certificates` is load-bearing — an
# image without it fails every metadata call, not just the private ones.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "form", "rustls"] }
tower = { version = "0.5", features = ["util"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = [
    "fs",
    "cors",
    "trace",
    "limit",
    "compression-gzip",
    "request-id",
    # A panicking handler must answer 500 rather than dropping the connection
    # with no response at all — see the layer in main.rs.
    "catch-panic",
]  }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
thiserror = "2"
futures = "0.3"
aes-gcm = "0.11"
# Password hashing for the single account of the `forms` mode. Argon2id with
# the crate's own defaults: the parameters that matter are memory and time
# cost, and the RustCrypto defaults track the OWASP recommendation.
argon2 = { version = "0.6", features = ["getrandom"] }
getrandom = "0.4"
base64 = "0.23"
subtle = "2"
sha2 = "0.11"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
http-body-util = "0.1"
# `test-util` only: it brings the paused clock the rate-limiter tests need, so
# pacing is asserted in virtual time rather than by actually sleeping through it.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
strip = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
uninlined_format_args = "allow"
