services:
  routarr:
    build:
      context: .
      dockerfile: Dockerfile
    image: routarr:latest
    container_name: routarr
    # Every interface, since the machines that need Routarr are elsewhere on the
    # LAN. Behind a reverse proxy on the same host, bind the loopback instead:
    # "127.0.0.1:9876:9876".
    ports:
      - "9876:9876"
    volumes:
      # The container runs as uid 1000, and Docker creates a missing bind-mount
      # directory owned by root, which the container then cannot write. Run
      # `mkdir -p config && chown 1000:1000 config` before the first start, or
      # use a named volume.
      - ./config:/config
      # The folder ROUTARR_BACKUP_COPY_DIR names below, on a NAS or another disk
      # and writable by uid 1000, for instance:
      # - /mnt/nas/routarr-backups:/backups-copy
      # A homelab certificate authority, for an Arr served over HTTPS, with
      # SSL_CERT_DIR below:
      # - ./certs:/certs:ro
    environment:
      - ROUTARR_PORT=9876
      - ROUTARR_HOST=0.0.0.0
      - ROUTARR_DB_PATH=/config/routarr.db
      - ROUTARR_LOG_LEVEL=info
      # The time zone the log lines are dated in, e.g. Europe/Paris.
      - TZ=${TZ:-}
      # With a certificate authority mounted at /certs. Each folder named
      # replaces the image's store, which therefore comes first.
      # - SSL_CERT_DIR=/etc/ssl/certs:/certs
      # Protects every /api/v1 route but the few a signed-out browser needs, and the webhook,
      # which carries its own token. Unset, a key is generated into /config/routarr.api_key on
      # first start (`docker exec routarr cat /config/routarr.api_key`), and Settings can replace
      # it. Set, this value wins, and changing the key means changing this line and restarting.
      - ROUTARR_API_KEY=${ROUTARR_API_KEY:-}
      # `external` delegates to a reverse proxy and asks for nothing, so bind
      # the port to that proxy alone. `none` turns authentication off entirely:
      # use it only on a network where anything that can reach Routarr may also
      # move your files.
      - ROUTARR_AUTH=${ROUTARR_AUTH:-apikey}
      - ROUTARR_ALLOWED_HOSTS=${ROUTARR_ALLOWED_HOSTS:-}
      - ROUTARR_TRUSTED_PROXIES=${ROUTARR_TRUSTED_PROXIES:-}
      # Encrypts the stored credentials: the Arr and metadata keys, the
      # notification address and the signing secret. Generated into
      # /config/routarr.key when unset. Every archive in /config/backups
      # carries it.
      - ROUTARR_SECRET_KEY=${ROUTARR_SECRET_KEY:-}
      # Only while rotating ROUTARR_SECRET_KEY. Remove it afterwards.
      - ROUTARR_PREVIOUS_SECRET_KEY=${ROUTARR_PREVIOUS_SECRET_KEY:-}
      # A second folder each backup archive is copied to, such as /backups-copy
      # mounted above, so that losing the disk of /config leaves the archives.
      # Empty, nothing is copied.
      - ROUTARR_BACKUP_COPY_DIR=${ROUTARR_BACKUP_COPY_DIR:-}
      # Optional. Set before the metadata sources are first saved, it lists TMDB
      # after Radarr and Sonarr. Afterwards, TMDB is turned on in the interface.
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    restart: unless-stopped
    # An apply that is stopping records the moves the Arr has made before the
    # database closes, which can take Routarr up to 20 seconds. Docker's
    # default 10 would kill it halfway.
    stop_grace_period: 30s
    # Docker's default driver keeps a log without end: five files of 10 MB at most here.
    # For the fail2ban jail of SECURITY.md, the journald driver instead, where `docker logs`
    # still reads it, in place of the two lines under `logging`:
    #   driver: journald
    #   options:
    #     tag: routarr
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Nothing Routarr does needs a Linux capability, so all are dropped, and `no-new-privileges`
    # stops a setuid binary from raising them again.
    #
    # The root filesystem is read-only, so code running inside the process cannot change the
    # program or the page it serves. What it can write is /config, the backup copy folder and
    # /tmp, a small tmpfs nothing can be run from.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
