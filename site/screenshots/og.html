<!doctype html>
<!-- Source of the Open Graph card. Rendered by capture.mjs at exactly 1200x630
     in the same browser that takes the product screenshots, because
     ImageMagick's SVG renderer has no usable text layout here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #131519;
    color: #f3f4f6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Liberation Sans", sans-serif;
    padding: 74px 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 6px;
    background: linear-gradient(90deg, #ffa500, #ffd166);
  }
  /* The same faded homelab grid as the site's hero. */
  .grid-layer {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(#2d323e 1px, transparent 1px),
      linear-gradient(90deg, #2d323e 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 75% 60% at 65% 0%, black, transparent 78%);
    mask-image: radial-gradient(ellipse 75% 60% at 65% 0%, black, transparent 78%);
    opacity: 0.4;
  }
  body::after {
    content: "";
    position: absolute;
    width: 760px;
    height: 760px;
    right: -260px;
    top: -320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,165,0,0.15) 0%, rgba(255,165,0,0) 68%);
  }
  .brand { display: flex; align-items: center; gap: 18px; position: relative; }
  .brand svg { width: 62px; height: 62px; }
  .brand span { font-size: 54px; font-weight: 800; letter-spacing: -1.5px; }
  h1 { font-size: 62px; line-height: 1.12; font-weight: 800; letter-spacing: -2px; position: relative; }
  h1 em {
    font-style: normal;
    background: linear-gradient(92deg, #ffa500, #ffd166 90%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  p { font-size: 27px; color: #b6bcc7; margin-top: 22px; position: relative; }
  ul { display: flex; gap: 12px; list-style: none; padding: 0; position: relative; }
  li {
    font-size: 21px;
    color: #9ca3af;
    border: 1px solid #2d323e;
    border-radius: 999px;
    padding: 10px 22px;
  }
</style>
</head>
<body>
  <div class="grid-layer"></div>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ffa500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3v12"/><path d="M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M15 6a9 9 0 0 0-9 9"/>
    </svg>
    <span>Routarr</span>
  </div>

  <div>
    <h1>Every title in the right folder,<br><em>decided by your rules.</em></h1>
    <p>Automatic root-folder routing for Radarr and Sonarr.</p>
  </div>

  <ul>
    <li>Dry-run first</li>
    <li>Every decision explained</li>
    <li>One Docker image</li>
    <li>Self-hosted</li>
  </ul>
</body>
</html>
