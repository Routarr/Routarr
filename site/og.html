<!doctype html>
<!-- The link preview card, rendered once per language by `og.mjs` at exactly
     1200x630, each `data-key` filled from that language's catalogue. Chromium
     lays out the text, which no SVG rasteriser here does with real fonts.

     It follows the site rather than leading it: the dark ground the site opens
     in, the headline the hero carries, and the accent the dark theme writes
     text in. A card that lags behind the site is the first thing a shared link
     says, and it says the wrong thing. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #131519;
    color: #f3f4f6;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Liberation Sans", sans-serif;
    padding: 74px 96px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    overflow: hidden;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 6px;
    background: #ffa500;
  }
  /* The same faded homelab grid as the site's hero, on the dark ground. */
  .grid-layer {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(#2d323e 1px, transparent 1px),
      linear-gradient(90deg, #2d323e 1px, transparent 1px);
    background-size: 44px 44px;
    -webkit-mask-image: radial-gradient(ellipse 75% 60% at 65% 0%, black, transparent 78%);
    mask-image: radial-gradient(ellipse 75% 60% at 65% 0%, black, transparent 78%);
    opacity: 0.55;
  }
  .brand { display: flex; align-items: center; gap: 18px; position: relative; }
  .brand svg { width: 58px; height: 58px; }
  .brand span { font-size: 48px; font-weight: 600; letter-spacing: -1.4px; }
  /* Weight 300 against 500, as the hero sets it: the size carries the claim
     and the weight steps up only for the clause that matters. */
  h1 { font-size: 92px; line-height: 1; font-weight: 300; letter-spacing: -3.2px; position: relative; }
  h1 .grad { display: block; font-weight: 500; color: #ffb733; }
  p { font-size: 26px; color: #b6bcc7; margin-top: 26px; position: relative; }
  ul { display: flex; flex-wrap: wrap; gap: 12px; list-style: none; padding: 0; position: relative; }
  li {
    font-size: 20px;
    color: #b6bcc7;
    border: 1px solid #2d323e;
    border-radius: 0;
    padding: 9px 20px;
  }
</style>
</head>
<body>
  <div class="grid-layer"></div>
  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ffa500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 3v12"/><path d="M18 9a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M6 21a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M15 6a9 9 0 0 0-9 9"/>
    </svg>
    <span>Routarr</span>
  </div>

  <div>
    <h1 data-key="page.h1"></h1>
    <p data-key="card.lead"></p>
  </div>

  <ul>
    <li data-key="card.chip.1"></li>
    <li data-key="card.chip.2"></li>
    <li data-key="card.chip.3"></li>
    <li data-key="card.chip.4"></li>
  </ul>
</body>
</html>
