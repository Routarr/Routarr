# The deb and rpm packages, built by `scripts/build-packages.sh` from the files of an image this
# repository built, so a package ships the very binary the image does. A `src` is relative to
# the staging folder the script fills, `ARCH` and `VERSION` come from its environment.
name: routarr
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: 1
section: net
priority: optional
maintainer: The Routarr contributors
description: |-
  Routing layer for Radarr and Sonarr
  Routarr reads movies and series from Radarr and Sonarr, enriches them from
  metadata sources, evaluates the rules you write, and moves each title to the
  right root folder through the Arr APIs. Its interface answers on port 9876.
vendor: Routarr
homepage: https://routarr.app
license: GPL-3.0-only

contents:
  - src: routarr
    dst: /usr/bin/routarr
    file_info:
      mode: 0755
  # Where the binary looks for its interface, beside `/usr/bin`, with the notices it links.
  - src: frontend
    dst: /usr/share/routarr/frontend
    type: tree
  - src: routarr.service
    dst: /usr/lib/systemd/system/routarr.service
    file_info:
      mode: 0644
  # The account exists by then: the preinstall script makes it before anything is unpacked.
  - dst: /etc/routarr
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: routarr
  - src: routarr-deb.env
    dst: /etc/routarr/routarr.env
    type: config|noreplace
    packager: deb
    file_info:
      mode: 0640
      owner: root
      group: routarr
  - src: routarr-rpm.env
    dst: /etc/routarr/routarr.env
    type: config|noreplace
    packager: rpm
    file_info:
      mode: 0640
      owner: root
      group: routarr
  - dst: /var/lib/routarr
    type: dir
    file_info:
      mode: 0750
      owner: routarr
      group: routarr
  # GPLv3 sections 4 and 6, where each family looks for a package's licence.
  - src: copyright
    dst: /usr/share/doc/routarr/copyright
    packager: deb
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/licenses/routarr/LICENSE
    packager: rpm
    file_info:
      mode: 0644
  - src: /usr/share/routarr/frontend/third-party-notices.txt
    dst: /usr/share/licenses/routarr/third-party-notices.txt
    type: symlink
    packager: rpm

# The preinstall script's `useradd`: every Debian has it, a minimal rpm system may not.
overrides:
  rpm:
    depends:
      - shadow-utils

scripts:
  preinstall: preinstall.sh
  postinstall: postinstall.sh
  preremove: preremove.sh
  postremove: postremove.sh
