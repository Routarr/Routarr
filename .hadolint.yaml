# What `hadolint` holds the two Dockerfiles to in CI.
#
# Package versions stay unpinned (DL3018 for apk, DL3008 for apt): Alpine and Debian drop
# a version from their repositories once the next one lands, so a pin breaks on their
# schedule. The base images are pinned by digest, but the packages added on top come from
# the live index, so two builds of one commit can differ.
ignored:
  - DL3018
  - DL3008
