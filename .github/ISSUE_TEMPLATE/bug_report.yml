name: Bug report
description: Something Routarr did, that it should not have
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem, please do **not** file it here — see
        [SECURITY.md](https://github.com/Routarr/Routarr/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to get there
      description: |
        The rule, the media item, the folders — enough to reproduce it. If a
        decision is involved, the "why" panel on the Library screen explains it
        condition by condition and that text is exactly what is needed here.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Routarr version
      description: Shown at the foot of the sidebar, and in `/api/v1/status`.
    validations:
      required: true

  - type: input
    id: arrs
    attributes:
      label: Radarr / Sonarr versions
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        `docker compose logs routarr`. **Remove any key or password before
        pasting.** At first start Routarr prints the API key it generates and,
        in `forms` mode, the password of the account it creates.
      render: text
    validations:
      required: false
