name: Bug report
description: Something Routarr did, that it should not have
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        If this is a security problem, please do **not** file it here. Follow
        [SECURITY.md](https://github.com/Routarr/Routarr/blob/main/SECURITY.md)
        instead.

  - type: checkboxes
    id: searched
    attributes:
      label: Before filing
      options:
        - label: I searched the open and closed issues, and this one is not among them.
          required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: And what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to get there
      description: |
        The rule, the media item, the folders: enough to reproduce it. If a
        decision is involved, the "why" panel on the Library screen explains it
        condition by condition and that text is exactly what is needed here.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Routarr version
      description: Shown at the foot of the sidebar, and in `/api/v1/status`.
    validations:
      required: true

  - type: input
    id: arrs
    attributes:
      label: Radarr / Sonarr versions
    validations:
      required: false

  - type: dropdown
    id: auth
    attributes:
      label: Sign-in mode
      description: "`ROUTARR_AUTH`, `apikey` when it is not set."
      options:
        - apikey
        - forms
        - oidc
        - external
        - none
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: How it runs
      description: |
        Compose, Unraid, Synology, TrueNAS, Podman or gVisor, amd64 or arm64, and a reverse
        proxy or `ROUTARR_BASE_PATH` if there is one.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser
      description: For a problem in the interface, the browser and its version.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        `docker compose logs routarr`. **Check for a key, a password or an
        address you would not publish before pasting.** For a crash (a line
        reading `Panicked`), set `RUST_BACKTRACE=1` for the container, make it
        happen again, and paste the backtrace that follows.
      render: text
    validations:
      required: false
