name: Site

# Production serves the site of the latest published release, built from its
# tag: main describes features no image carries yet. Cloudflare builds main as
# an uploaded version it never deploys, so this workflow is the only way to
# production. A published release deploys, a manual run deploys the latest
# release again, and a weekly run compares production with that tag, since
# the Cloudflare zone can add to a response what the repository never declared.
# Apart from `ci.yml`: a release event is neither a push nor a pull request.
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions: {}

# A deploy that started finishes: cancelled midway, production keeps whichever
# version Cloudflare had last switched to.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  release:
    name: Find the latest release
    runs-on: ubuntu-latest
    # A prerelease is never the latest release, so publishing one deploys
    # nothing new.
    if: github.event_name != 'release' || !github.event.release.prerelease
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "The latest release is $tag."

  deploy:
    name: Deploy the released site
    needs: release
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            frontend/package-lock.json

      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx astro check
        working-directory: site

      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Static checks
        env:
          ROUTARR_SITE_RELEASE: ${{ needs.release.outputs.tag }}
        run: node site/check.mjs
      - name: Browser checks
        run: node site/verify.mjs

      # The token is scoped to Workers, and `wrangler` is the site's own pinned
      # devDependency.
      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing: production still serves the previous release."
            exit 1
          fi
          npx wrangler deploy

  live:
    name: Production serves the release
    needs: [release, deploy]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.deploy.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend

      # The release states what its own production looks like. One cut before
      # the check existed says so instead of failing.
      - name: Compare production with the release
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          if [ ! -f site/live.mjs ]; then
            echo "::notice::$TAG carries no site/live.mjs, so production is not compared."
            exit 0
          fi
          node site/live.mjs
