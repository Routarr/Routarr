name: Site

# Production serves the site of the latest published release, built from its
# tag: main describes features no image carries yet. Cloudflare builds nothing
# itself, so this workflow is the only way to production. A published release
# deploys, a manual run deploys the latest release again, and a weekly run
# compares production with that tag, since the Cloudflare zone can add to a
# response what the repository never declared.
# Apart from `ci.yml`: a release event is neither a push nor a pull request.
on:
  release:
    types: [published]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions: {}

# A deploy that started finishes: cancelled midway, production keeps whichever
# version Cloudflare had last switched to.
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  release:
    name: Find the latest release
    runs-on: ubuntu-24.04
    # A prerelease is never the latest release, so publishing one deploys
    # nothing new.
    if: github.event_name != 'release' || !github.event.release.prerelease
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
    steps:
      - id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "The latest release is $tag."

  # The released site built and checked, holding no secret: both trees' packages and the
  # site's install scripts run here, apart from the token that publishes. No cache is restored,
  # since anything that runs on main can write one.
  build:
    name: Build the released site
    needs: release
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version

      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx astro check
        working-directory: site

      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Static checks
        env:
          ROUTARR_SITE_RELEASE: ${{ needs.release.outputs.tag }}
        run: node site/check.mjs
      - name: Browser checks
        run: node site/verify.mjs

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # What `build` checked, deployed from the `production` environment, which holds the Cloudflare
  # secrets for release tags and main alone. Only wrangler runs beside the token, from the
  # site's lockfile installed without its install scripts.
  deploy:
    name: Deploy the released site
    needs: [release, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - run: npm ci --ignore-scripts
        working-directory: site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist

      # The token is scoped to Workers, and `wrangler` is the site's own pinned
      # devDependency.
      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing: production still serves the previous release."
            exit 1
          fi
          npx wrangler deploy

  live:
    name: Production serves the release
    needs: [release, build, deploy]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.build.result != 'failure' && needs.deploy.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Compare production with the release
        run: node site/live.mjs
