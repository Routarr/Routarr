name: CI

# No `paths-ignore`: `changes` filters and always runs. A skipped workflow never reports, so a
# required check blocks the pull request and the release guard refuses the commit.
on:
  push:
    branches: [main]
  pull_request:

# Read only: a job that needs more states it on the job. No checkout keeps the token in its
# clone, where every later step could read it: `gh` takes `GH_TOKEN`.
permissions:
  contents: read

# A pull request keeps its newest run, keyed by number since two forks can name a branch
# alike. A push to main runs to the end: the next one is compared with the last that succeeded.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which of the three deliverables a commit touched, by
  # `scripts/changed-areas.sh`, which a dry run can call from a clone.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # To read which commit of main last passed.
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both sides of the comparison have to be present in the clone.
          fetch-depth: 0
          persist-credentials: false

      # A push to main is compared with the last commit of main whose run succeeded: a failed
      # run tested nothing, so its areas are tested in this one.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          else
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)
          fi
          areas=$(bash scripts/changed-areas.sh "$base" "$HEAD")
          printf '%s\n' "$areas" | tee -a "$GITHUB_OUTPUT"
          # A missing line skips every job it gates, and the run reads green.
          for area in backend frontend site; do
            grep -qxE "$area=(true|false)" <<<"$areas" || { echo "::error::no $area line"; exit 1; }
          done

      # Here, unfiltered: a commit touching only a Dockerfile matches no area, and a partial
      # version bump would land green.
      - name: Check the toolchain versions agree
        run: python3 scripts/check-versions.py

  # What no deliverable's job reads: the workflows, scripts, Dockerfiles, memory files, history,
  # the contract against the last release and the punctuation of everything. Unfiltered, like
  # `changes`, and needed by no other job.
  #
  # The linters come from their releases at the sums below, the dev container's versions
  # (`check-versions.py`), shellcheck included, whose runner copy moves with the image. Every
  # check runs whatever the one before answered.
  repository:
    name: Repository lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads every commit, not the last one, and the API contract
          # is compared with the last release's tag.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the memory files stay short
        run: python3 scripts/check-claude-md.py

      - name: Check the text a reader sees for plain punctuation
        if: ${{ !cancelled() }}
        run: python3 scripts/check-typography.py

      - name: Check the shipped migrations are unchanged
        if: ${{ !cancelled() }}
        run: python3 scripts/check-migrations.py

      - name: Check the fail2ban recipe of SECURITY.md reads Routarr's lines
        if: ${{ !cancelled() }}
        run: python3 scripts/check-fail2ban.py

      # Reads `backend/deny.toml`, `backend/about.toml` and `frontend/package-lock.json`, which no
      # area's job sees together.
      - name: Check the licences of what the image ships
        if: ${{ !cancelled() }}
        run: python3 scripts/check-licences.py

      - name: Test the scripts CI relies on
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Install the pinned linters
        id: tools
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          OASDIFF_SHA256: 7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f
          RUFF_SHA256: ad1b2138407a0c53b936524df99d87211333f7bc40478d6860f42994597f7ff0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C "$HOME/bin" actionlint
          curl -fsSL -o "$HOME/bin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "$HADOLINT_SHA256  $HOME/bin/hadolint" | sha256sum -c -
          chmod +x "$HOME/bin/hadolint"
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C "$HOME/bin" gitleaks
          curl -fsSL -o /tmp/oasdiff.tgz \
            https://github.com/oasdiff/oasdiff/releases/download/v1.32.1/oasdiff_1.32.1_linux_amd64.tar.gz
          echo "$OASDIFF_SHA256  /tmp/oasdiff.tgz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tgz -C "$HOME/bin" oasdiff
          curl -fsSL -o /tmp/ruff.tgz \
            https://github.com/astral-sh/ruff/releases/download/0.16.10/ruff-x86_64-unknown-linux-musl.tar.gz
          echo "$RUFF_SHA256  /tmp/ruff.tgz" | sha256sum -c -
          tar -xzf /tmp/ruff.tgz -C "$HOME/bin" --strip-components=1 ruff-x86_64-unknown-linux-musl/ruff
          curl -fsSL -o /tmp/shellcheck.txz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "$SHELLCHECK_SHA256  /tmp/shellcheck.txz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.txz -C "$HOME/bin" --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Here, unfiltered: a new release tag changes what the contract is compared with, and wakes
      # no area.
      - name: Check the API contract breaks no client of the last release
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bash scripts/check-api-breaks.sh

      - name: Lint the workflows
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: actionlint -no-color
      - name: Lint the shell scripts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S style
      - name: Lint the Python scripts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: ruff check scripts frontend/e2e site/screenshots
      # The Node scripts outside the two packages run under no compiler.
      - name: Check the Node scripts parse
        if: ${{ !cancelled() }}
        run: |
          status=0
          for script in scripts/*.mjs site/*.mjs site/screenshots/*.mjs; do
            node --check "$script" || status=1
          done
          exit "$status"
      - name: Lint the Dockerfiles
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: hadolint Dockerfile .devcontainer/Dockerfile
      - name: Look for committed secrets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: gitleaks git --no-banner --redact .

  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Every job carries a ceiling because GitHub's own is six hours. Sized to
    # catch a hang, not a slow day.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No toolchain step: rustup reads rust-toolchain.toml, the version the image ships.

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      # A broken intra-doc link is the one warning `clippy` does not see.
      - name: Check the documentation builds clean
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Check locales
        # Run from the root: it reads backend/locales but scans both source
        # trees for the keys that reference them.
        working-directory: .
        run: python3 scripts/check-locales.py

      # The contract is written twice, in two languages, and nothing else joins
      # them: a renamed field compiles, passes both suites, and renders
      # `undefined`.
      - name: Check the API contract
        working-directory: .
        run: python3 scripts/check-api-types.py

      - name: Test
        run: cargo test --locked

      # A RustSec advisory, an unmaintained or yanked crate, a licence the GPL cannot ship beside,
      # or a source nobody named fails here (`deny.toml`).
      - name: Check advisories, licences and sources
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          # Named with its version rather than taken from the ref
          # (`@cargo-deny`), whose meaning a commit pin silently changes. The
          # version the dev container installs (`check-versions.py`).
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  coverage:
    name: Backend coverage
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Instrumented, so it cannot reuse the test job's artifacts. Kept separate
    # so a slow measurement never delays "do the tests pass".
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          # The version the dev container installs (`check-versions.py`), so
          # the floor is measured by one tool on both sides.
          tool: cargo-llvm-cov@0.9.1

      # The floor sits at the whole figure below the measure and rises with it. `src/tests/` would
      # inflate the figure, and only a running process reaches `process.rs`.
      - name: Measure coverage
        run: |
          cargo llvm-cov --locked --summary-only --fail-under-lines 96 \
            --ignore-filename-regex 'src/(tests/|process\.rs)'

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # No install script runs: the tree needs none (the Dockerfile builds it
      # the same way), and one would run whatever a compromised release ships,
      # on main, with the job's cache credentials.
      - id: install
        run: npm ci --ignore-scripts

      # Only what the bundle ships, at `high`: a development tool's advisory is Dependabot's to
      # raise, and a gate that fires on everything is one people learn to skip.
      #
      # Each step below runs whatever the one before it answered.
      - name: Audit the shipped dependencies
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run format:check
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      # Also in the backend job: the contract breaks from either side, and the
      # path filters gate the two separately.
      - name: Check the API contract
        if: ${{ !cancelled() }}
        working-directory: .
        run: python3 scripts/check-api-types.py

      # Same reason: the dictionaries are in `backend/`, the keys reading them in `frontend/src`.
      - name: Check locales
        if: ${{ !cancelled() }}
        working-directory: .
        run: python3 scripts/check-locales.py

      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run coverage

      # `npm run build` runs svelte-check first, so this is the application's
      # type check too.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      # The specs have a tsconfig of their own, which the build does not read,
      # and Playwright strips their types without checking them.
      - name: Type-check the end-to-end specs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsc -p e2e --noEmit

      # The two bundles every visit downloads: nothing else measures them.
      - name: Check the bundle size
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: .
        run: node scripts/check-bundle-size.mjs

  e2e:
    name: End-to-end in ${{ matrix.browser }}
    runs-on: ubuntu-latest
    # WebKit runs the suite the slowest, after system packages from a mirror that can stall.
    timeout-minutes: 60
    needs: changes
    # Drives the release binary *serving the built frontend*, so either side
    # changing is reason enough to run it.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    # The whole suite in each engine the README promises, none cancelling another.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      ROUTARR_E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install ${{ matrix.browser }} --with-deps
        working-directory: frontend

      - name: End-to-end
        run: npm run test:e2e
        working-directory: frontend

      # Under a sub-path, as behind a reverse proxy, where a break is hardest to diagnose.
      - name: End-to-end behind a sub-path
        run: npm run test:e2e:base
        working-directory: frontend

      # A server in `forms` mode, then in `oidc` mode against a stand-in
      # provider: the only place a session the browser never keeps shows.
      - name: End-to-end in each sign-in mode
        run: npm run test:e2e:auth
        working-directory: frontend

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/test-results/
          retention-days: 7

  # The one name the branch rules require, for the three engines' runs:
  # passed in each, or not needed by the commit.
  e2e-done:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Every engine passed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success || test "$RESULT" = skipped

  site:
    name: Showcase site
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.site == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            frontend/package-lock.json

      # With its install scripts: esbuild and workerd fetch their binaries in
      # them.
      - run: npm ci
        working-directory: site

      # Warns only: these packages build the site, and an advisory against a build tool can stand
      # unfixed for weeks. Dependabot's alerts follow it up.
      - name: Audit the build tools
        working-directory: site
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning::npm audit reports a high advisory in the site's build tools"
          fi

      # Everything below reads `site/dist`, what Cloudflare serves.
      - name: Build
        run: npm run build
        working-directory: site

      # Astro's own type check over the components and the i18n catalogue: a
      # key the markup asks for and English does not have fails here, before
      # anything is rendered.
      - name: Type-check the components
        run: npx astro check
        working-directory: site

      # Playwright for `verify.mjs`, loaded from frontend/node_modules (`site/playwright.mjs`).
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend

      - name: Static checks
        run: node site/check.mjs

      # Loads the page under the real `_headers`, so a CSP that blocks the
      # stylesheet fails here instead of on the deployed site.
      - name: Browser checks
        run: node site/verify.mjs
