name: CI

# No `paths-ignore` here on purpose: the `changes` job below is the filter, and
# it always runs. A commit the workflow skips entirely has no run at all, and
# the release guard then refuses to tag it while telling the author to wait for
# a CI that was never going to come.
on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository: the token can only read it. A job that
# one day needs more states it on the job, not here.
permissions:
  contents: read

# A pull request keeps its newest run, a new push cancelling the one it
# supersedes, keyed by number since two forks can name a branch alike. A push
# to main runs to the end in a group of its own: the next one is compared with
# the last commit whose run succeeded, and a cancelled run succeeds at nothing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Every `uses:` is pinned to a commit, with its tag in the comment beside it. A
# tag is a mutable pointer its owner can move, and `release.yml` holds
# `packages: write`. Dependabot updates the id and the comment together.

jobs:
  # Which of the three deliverables a commit touched, by
  # `scripts/changed-areas.sh`, which a dry run can call from a clone.
  changes:
    name: What changed
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    # To read which commit of main last passed.
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both sides of the comparison have to be present in the clone.
          fetch-depth: 0

      # A pull request is compared with its base. A push to main is compared
      # with the last commit of main whose run succeeded, not with the one
      # before it: a failed run tested nothing, and the release guard reads only
      # the tagged commit's own runs, so the areas it left behind are tested in
      # this run.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          else
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)
          fi
          areas=$(bash scripts/changed-areas.sh "$base" "$HEAD")
          printf '%s\n' "$areas" | tee -a "$GITHUB_OUTPUT"
          # A missing line skips every job it gates, and the run reads green.
          for area in backend frontend site; do
            grep -qxE "$area=(true|false)" <<<"$areas" || { echo "::error::no $area line"; exit 1; }
          done

      # `changes` and `repository` are the two jobs with no path filter, and a
      # check that must see every commit goes in one of them: a commit touching
      # just `Dockerfile` matches none of the three areas, so every filtered job
      # skips and a partial version bump would land green.
      - name: Check the toolchain versions agree
        run: python3 scripts/check-versions.py

  # What no deliverable's job reads: the workflows, the shell harnesses, the
  # Dockerfiles, the memory files Claude Code loads, the history, the API
  # contract against the last release, and the punctuation of every
  # deliverable at once. Unfiltered for the same reason as
  # `changes`, and needed by no other job, so a failure here skips nothing else.
  #
  # The five binaries are fetched from their releases and checked against the
  # sums recorded here, so a moved tag or a replaced asset fails the step
  # rather than running. The dev container installs the same versions, which
  # `scripts/check-versions.py` holds in step: shellcheck is pinned rather than
  # taken from the runner image, whose version moves with the image.
  #
  # Each check runs whatever the one before it answered, so a first failure
  # hides none of the others, gitleaks included.
  repository:
    name: Repository lint
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads every commit, not the last one, and the API contract
          # is compared with the last release's tag.
          fetch-depth: 0

      - name: Check the memory files stay short
        run: python3 scripts/check-claude-md.py

      - name: Check the text a reader sees for plain punctuation
        if: ${{ !cancelled() }}
        run: python3 scripts/check-typography.py

      - name: Install the pinned linters
        id: tools
        if: ${{ !cancelled() }}
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          OASDIFF_SHA256: 7c8939fc49b75ee11fec66a5b83b37a2fca6aee109fed85013b1ba2ac2a1ee7f
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL -o /tmp/actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "$ACTIONLINT_SHA256  /tmp/actionlint.tgz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tgz -C "$HOME/bin" actionlint
          curl -fsSL -o "$HOME/bin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "$HADOLINT_SHA256  $HOME/bin/hadolint" | sha256sum -c -
          chmod +x "$HOME/bin/hadolint"
          curl -fsSL -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C "$HOME/bin" gitleaks
          curl -fsSL -o /tmp/oasdiff.tgz \
            https://github.com/oasdiff/oasdiff/releases/download/v1.32.1/oasdiff_1.32.1_linux_amd64.tar.gz
          echo "$OASDIFF_SHA256  /tmp/oasdiff.tgz" | sha256sum -c -
          tar -xzf /tmp/oasdiff.tgz -C "$HOME/bin" oasdiff
          curl -fsSL -o /tmp/shellcheck.txz \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "$SHELLCHECK_SHA256  /tmp/shellcheck.txz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.txz -C "$HOME/bin" --strip-components=1 shellcheck-v0.11.0/shellcheck
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Unfiltered with the rest of this job: a commit touching the pinned
      # contract alone would wake the backend job, but one moving the tag the
      # contract is compared with wakes nothing else.
      - name: Check the API contract breaks no client of the last release
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: bash scripts/check-api-breaks.sh

      - name: Lint the workflows
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: actionlint -no-color
      - name: Lint the shell scripts
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S style
      - name: Lint the Dockerfiles
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: hadolint Dockerfile .devcontainer/Dockerfile
      - name: Look for committed secrets
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: gitleaks git --no-banner --redact .

  backend:
    name: Backend
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Every job carries a ceiling because GitHub's own is six hours. Sized to
    # catch a hang, not a slow day.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No toolchain pin here on purpose: rustup reads rust-toolchain.toml, so
      # CI compiles with the exact version the release image ships.

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      # A broken intra-doc link is the one warning `clippy` does not see.
      - name: Check the documentation builds clean
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Check locales
        # Run from the root: it reads backend/locales but scans both source
        # trees for the keys that reference them.
        working-directory: .
        run: python3 scripts/check-locales.py

      # The contract is written twice, in two languages, and nothing else joins
      # them: a renamed field compiles, passes both suites, and renders
      # `undefined`.
      - name: Check the API contract
        working-directory: .
        run: python3 scripts/check-api-types.py

      - name: Test
        run: cargo test --locked

      # Fails on any RUSTSEC advisory. The dependency tree is pruned
      # (`sqlx` with `default-features = false`) so this can be a hard gate.
      - name: Audit dependencies
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          # Named rather than taken from the ref (`@cargo-audit`), whose
          # meaning a commit pin silently changes.
          tool: cargo-audit
      - run: cargo audit

      # What `cargo audit` does not look at: a licence the GPL cannot ship
      # beside, a crate from a source nobody named, a yanked version.
      # `deny.toml` states the allow-list.
      - name: Check licences and sources
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          # The version the dev container installs (`check-versions.py`).
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  coverage:
    name: Backend coverage
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Instrumented, so it cannot reuse the test job's artifacts. Kept separate
    # so a slow measurement never delays "do the tests pass".
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov

      # A floor at the whole figure below the measure, raised with it: a module
      # landing with no test trips it. `src/tests/` is excluded because
      # measuring the tests' own coverage inflates the figure, and `main.rs`
      # because the end-to-end suite covers it and this one cannot.
      - name: Measure coverage
        run: |
          cargo llvm-cov --summary-only --fail-under-lines 96 \
            --ignore-filename-regex 'src/(tests/|main\.rs)'

  frontend:
    name: Frontend
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # The counterpart of `cargo audit`, over the whole tree including
      # development dependencies, for symmetry with what it checks in
      # Cargo.lock. `high` rather than `moderate`: a gate that fires on
      # everything is one people learn to skip. `--omit=dev` narrows it to what
      # ships if dev-only advisories make it noisy.
      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint

      # Also in the backend job: the contract breaks from either side, and the
      # path filters gate the two separately.
      - name: Check the API contract
        working-directory: .
        run: python3 scripts/check-api-types.py

      # Same reason: the dictionaries live in `backend/`, the keys that read
      # them in `frontend/src`. A pull request touching only a component never
      # runs the backend job, so without this step a key with no dictionary
      # entry, rendered raw on screen, would pass here and fail on the next
      # person's backend change.
      - name: Check locales
        working-directory: .
        run: python3 scripts/check-locales.py

      # `coverage.include` in vite.config.ts is load-bearing: without it v8
      # counts only the files a test imported, reporting a high number over a
      # small fraction of the tree.
      - name: Test
        run: npm run coverage

      # `npm run build` runs svelte-check first, so this is the application's
      # type check too.
      - name: Build
        run: npm run build

      # The specs have a tsconfig of their own, which the build does not read,
      # and Playwright strips their types without checking them.
      - name: Type-check the end-to-end specs
        run: npx tsc -p e2e --noEmit

      # The two bundles every visit downloads, held to a ceiling: nothing else
      # measures them, and a size that drifts up is invisible until the
      # dashboard downloads the rule builder with it.
      - name: Check the bundle size
        working-directory: .
        run: node scripts/check-bundle-size.mjs

  e2e:
    name: End-to-end in ${{ matrix.browser }}
    runs-on: ubuntu-26.04
    # WebKit runs the suite at about half Chromium's pace.
    timeout-minutes: 40
    needs: changes
    # Drives the release binary *serving the built frontend*, so either side
    # changing is reason enough to run it.
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true'
    # Once per engine the README promises, each the whole suite: a fault one
    # engine shows is not stopped by another's.
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      ROUTARR_E2E_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npx playwright install ${{ matrix.browser }} --with-deps
        working-directory: frontend

      # Drives the release binary serving the built frontend against a fake
      # Radarr: the only place a broken route, a dead control or a folded table
      # cell can actually be caught.
      - name: End-to-end
        run: npm run test:e2e
        working-directory: frontend

      # Mounted under a sub-path, the case that only ever breaks behind a
      # reverse proxy, where it is hardest to diagnose.
      - name: End-to-end behind a sub-path
        run: npm run test:e2e:base
        working-directory: frontend

      # A server in `forms` mode, then in `oidc` mode against a stand-in
      # provider: the only place a session the browser never keeps shows.
      - name: End-to-end in each sign-in mode
        run: npm run test:e2e:auth
        working-directory: frontend

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: frontend/test-results/
          retention-days: 7

  # The one name the branch rules require, for the three engines' runs:
  # passed in each, or not needed by the commit.
  e2e-done:
    name: End-to-end
    runs-on: ubuntu-26.04
    needs: e2e
    if: always()
    steps:
      - name: Every engine passed
        env:
          RESULT: ${{ needs.e2e.result }}
        run: test "$RESULT" = success || test "$RESULT" = skipped

  site:
    name: Showcase site
    runs-on: ubuntu-26.04
    needs: changes
    if: needs.changes.outputs.site == 'true'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            frontend/package-lock.json

      - run: npm ci
        working-directory: site

      # Everything below reads `site/dist`, which is what Cloudflare serves.
      # Checking the sources would test the intention. This tests the artefact.
      - name: Build
        run: npm run build
        working-directory: site

      # Astro's own type check over the components and the i18n catalogue: a
      # key the markup asks for and English does not have fails here, before
      # anything is rendered.
      - name: Type-check the components
        run: npx astro check
        working-directory: site

      # Playwright, for the browser pass below. The site has no runtime
      # dependency of its own.
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
        working-directory: frontend

      # Origins, CSP hash, image dimensions, contrast, dead links.
      - name: Static checks
        run: node site/check.mjs

      # Loads the page under the real `_headers`, so a CSP that blocks the
      # stylesheet fails here instead of on the deployed site.
      - name: Browser checks
        run: node site/verify.mjs
