name: Release

# Tags only. `ci.yml` already builds the image on every push to main with
# `push: false`, which proves the Dockerfile works; this is the one place an
# image leaves the runner, and it should happen because someone tagged a
# release rather than because someone merged.
on:
  push:
    tags: ['v*']

# Every `uses:` is pinned to a commit, with the tag it was in a comment beside
# it. A tag is a mutable pointer its owner can move: `@v7` means "whatever the
# owner calls v7 the next time this runs", and one of these workflows holds
# `packages: write` and pushes an image to GHCR. A commit id cannot be moved.
# Dependabot updates both the id and the comment, so this costs nothing to keep
# current — it only changes who decides when the code changes.

jobs:
  # A tag can be pushed onto a commit whose CI failed, and the tag triggers the
  # publish directly. GHCR is not a place to take something back from, so this
  # asks the one question worth asking first.
  guard:
    name: The commit is green
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Check CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          runs=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$SHA&per_page=100" \
            --jq '.workflow_runs[] | select(.name != "Release") | "\(.name)\t\(.conclusion // .status)"')

          if [ -z "$runs" ]; then
            echo "::error::No workflow run for $SHA. Push the commit to main and let CI finish before tagging it."
            exit 1
          fi

          printf '%s\n' "$runs"

          # A skipped run is a legitimate answer — the path filters skip whole
          # areas a commit did not touch. A failed or cancelled one is not.
          #
          # awk, not grep: the two fields are separated by a tab, and `\t` in an
          # ERE is a literal `t`, so a grep pattern written that way matches
          # nothing and refuses every commit ever tagged.
          rejected=$(printf '%s\n' "$runs" | awk -F'\t' '$2 != "success" && $2 != "skipped"')
          if [ -n "$rejected" ]; then
            printf 'Not green:\n%s\n' "$rejected"
            echo "::error::At least one workflow on $SHA did not succeed. Nothing published."
            exit 1
          fi

  # One job per architecture, each on a runner of that architecture.
  #
  # The arm64 leg used to be emulated beside the other on an amd64 runner,
  # which for a Rust release build means QEMU: it measured 115 minutes, then
  # outgrew the three-hour ceiling and was killed with nothing published. The
  # comment that stood here said a tag read a warm cache written by the default
  # branch, and that was never true — `docker.yml` builds `linux/amd64` alone,
  # so no arm64 layer has ever been in that cache and every release paid for a
  # cold emulated build.
  image:
    name: Build ${{ matrix.arch }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # Both legs run to the end: one architecture failing while the other is
      # still building tells you less than two verdicts do.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # No secret to manage: the token GitHub already hands the job is
          # enough, given `packages: write` above.
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry path holding a capital letter is rejected, and the
      # repository is `Routarr/Routarr`. metadata-action lower-cases what it
      # writes; the name handed to `outputs` below is ours to lower-case.
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Labels only here. The tags name the manifest list, which does not exist
      # until the next job assembles it.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}

      # Pushed by digest and carrying no tag: a tag applied here would be taken
      # by whichever architecture pushed last, leaving the other unreachable
      # under the name people pull.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record carries the event that started the run, the
          # pusher's address included, and an artifact of a public repository
          # is public.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # A public repository gets the `max` level by default, which writes
          # the build environment into the image, the triggering event
          # included. The provenance that is verified is the signed one
          # attested below.
          provenance: mode=min
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # A scope per architecture. Sharing one, the two legs evict each
          # other's layers and neither ever reads a warm cache.
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Hand the digest to the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # What makes `:0.1.0` mean both architectures. Each is in the registry by
  # now, reachable only by its own digest; this assembles the manifest list
  # that carries the tags, and attests that one digest.
  manifest:
    name: Publish the image
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # For the provenance attestation below: `id-token` signs it, and
      # `attestations` records it against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The tag set derived from the git tag, so `v1.2.3` publishes 1.2.3, 1.2,
      # 1 and latest, and a pre-release takes none of those with it.
      #
      # No `0` tag: semver makes no compatibility promise across 0.x, so a tag
      # following every 0.x release would promise exactly what those releases
      # do not. The major tag starts with 1.0.0.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
          flavor: |
            latest=auto

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          refs=""
          for digest in *; do
            refs="$refs ${IMAGE}@sha256:${digest}"
          done
          # Both expansions are meant to split into separate arguments: one
          # `-t` per tag, one reference per architecture.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $refs

      # The manifest list's own digest, which is what a `docker pull` of the
      # tag resolves to and therefore the only one worth attesting.
      - id: digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          value=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # Signed evidence of which workflow, on which commit, built this exact
      # digest — attached to the image in the registry, so `gh attestation
      # verify` answers it without trusting this repository's own word for it.
      # An image people pull onto machines holding their media library is worth
      # the three lines.
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

  # The release itself. Publishing it by hand — `gh release create` from a
  # laptop — is the kind of step that gets forgotten or done differently each
  # time, so it happens here. Notes are generated from the commits since the
  # last tag, which is what the log is written for.
  release:
    name: Publish the release
    needs: manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # `gh release create` shells out to git to work out which repository it
      # is in, so it needs one to stand in even though nothing here reads a
      # file: without it the step fails with "not a git repository" before it
      # reaches the API. The default shallow fetch is enough, since the notes
      # are generated server-side. This job had never run to the end before —
      # the image job was cancelled at its ceiling every time — so the fault
      # shipped unseen.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `--generate-notes` finds the previous tag on its own; naming one
          # explicitly only creates a way to name the wrong one. `--verify-tag`
          # refuses to invent a tag that does not exist, which it cannot here —
          # but the day someone runs this by hand it can.
          #
          # A draft, because generated notes are a list of every commit since the
          # last tag and most of them are internal. The release is announced once
          # somebody has written what changed for a user; the image is on GHCR
          # either way, so nothing waits on that. See CONTRIBUTING.md.
          # A hyphen after the version is what semver calls a pre-release, and
          # it is the same rule metadata-action applies when it declines to move
          # `latest`. Without this the image would treat v1.0.0-rc1 as a
          # pre-release while the release page called it the real thing.
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --draft $prerelease
