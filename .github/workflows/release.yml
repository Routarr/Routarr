name: Release

# The one place an image leaves the runner, never on a merge (`docker.yml` builds with
# `push: false`). A `v*` tag publishes its exact version `X.Y.Z`, and the release's publication
# moves `latest` and `X.Y` onto it, so whoever follows them upgrades once the notes are there.
on:
  push:
    tags: ['v*']
  release:
    types: [published]

# A tag deleted and pushed again starts a second run, which cancels the first:
# two runs finishing in either order would each name the version.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# No permission unless a job names it: a job added without its own block holds
# nothing, whatever the repository's default token.
permissions: {}

# `bash -eo pipefail` for every step: a pipe whose left side fails, as a registry read can, fails
# the step rather than hand an empty value to the next.
defaults:
  run:
    shell: bash

# Every `uses:` is pinned to a commit, its tag in the comment beside it: a tag can be moved,
# and this workflow pushes to GHCR. Dependabot updates both.

jobs:
  # A tag publishes whatever commit it sits on: `scripts/release-guard.sh` first refuses a
  # lightweight tag, a commit on neither main nor its minor's release branch, not green, not at
  # the tag's version, with migrations not folded, or already in the registry.
  guard:
    name: The commit may be published
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The migrations are compared with the last release's tag.
          fetch-depth: 0
          persist-credentials: false
      - name: Check the commit and the version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-guard.sh "$REPOSITORY" "$SHA" "$TAG"

  # One job per architecture, on a runner of that architecture (under QEMU the arm64 leg takes
  # hours), which starts its image before pushing it: the only place the images people pull run.
  #
  # Neither leg restores a cache: any job on main can write the one `docker.yml` keeps, and a
  # layer restored here would be published under this workflow's signature.
  image:
    name: Build ${{ matrix.arch }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      # The build record carries the event that started the run, the pusher's
      # address included, and an artifact of a public repository is public.
      # The metadata each build prints in its log carries the same event
      # unless its provenance is off too.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
      BUILDX_METADATA_PROVENANCE: disabled
    strategy:
      # Both legs run to the end, for two verdicts.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit by digest, like a base image. Dependabot does not read this line, and
      # `scripts/check-versions.py` holds the copies in `docker.yml` to it.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A registry path holding a capital letter is rejected, and the
      # repository is `Routarr/Routarr`. metadata-action lower-cases what it
      # writes, but the name handed to `outputs` below is ours to lower-case.
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # The version and the commit only: metadata-action's own labels would replace the
      # Dockerfile's with the repository's (`GPL-3.0`, a version keeping its `v`). The tags go on
      # the manifest list.
      - id: labels
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo 'value<<LABELS'
            echo "org.opencontainers.image.version=${TAG#v}"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            echo 'LABELS'
          } >> "$GITHUB_OUTPUT"

      # Into the runner's Docker, so the next step can start it. The push below
      # rebuilds from the builder's own cache and sends these same layers.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # BuildKit's provenance copies the event that started the run, the
          # pusher's name and address included, into the image. The
          # attestation the manifest job signs is the provenance.
          provenance: false
          load: true
          tags: routarr:smoke

      - name: Start the image and check it serves
        run: bash scripts/smoke-image.sh routarr:smoke

      # Pushed by digest and carrying no tag: a tag applied here would be taken
      # by whichever architecture pushed last, leaving the other unreachable
      # under the name people pull.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          # The packages of the image, the crates `cargo auditable` wrote into
          # the binary among them, for a scanner reading the registry. The
          # scanner is an image too, pinned by digest for the same reason as
          # BuildKit.
          sbom: generator=docker/buildkit-syft-scanner:1.12.0@sha256:ae4f3b554449e7e25548e7d8ccc029d17357348e30c6e3df01b92bc93654d6a9
          labels: ${{ steps.labels.outputs.value }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true

      - name: Hand the digest to the manifest job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # What makes `:0.1.0` mean both architectures. Each is in the registry by
  # now, reachable only by its own digest. This job assembles the manifest list
  # that carries the tags, and attests that list's one digest.
  manifest:
    name: Publish the image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      # For the provenance attestation below: `id-token` signs it, and
      # `attestations` records it against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The images took long enough to build for the tag to have moved, or the
      # version to have been published by another run.
      - name: Check the tag and the version again
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-guard.sh --publishing "$REPOSITORY" "$SHA" "$TAG"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # `v1.2.3` publishes 1.2.3 alone. The tags people follow move when the release is
      # published (the `promote` job).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
          flavor: |
            latest=false

      - name: Create the manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          refs=""
          for digest in *; do
            refs="$refs ${IMAGE}@sha256:${digest}"
          done
          # Both expansions are meant to split into separate arguments: one
          # `-t` per tag, one reference per architecture.
          #
          # The labels sit on each platform's image, and the registry describes
          # a multi-platform image from its index alone.
          # shellcheck disable=SC2046,SC2086
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=A routing and classification layer for the Servarr ecosystem" \
            --annotation "index:org.opencontainers.image.licenses=GPL-3.0-only" \
            --annotation "index:org.opencontainers.image.source=https://github.com/Routarr/Routarr" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $refs

      # The manifest list's own digest, which is what a `docker pull` of the
      # tag resolves to and therefore the only one worth attesting.
      - id: digest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          value=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$value" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for ${IMAGE}:${VERSION}"; exit 1; }
          echo "value=$value" >> "$GITHUB_OUTPUT"

      # Signed evidence of which workflow built this digest on which commit, for
      # `gh attestation verify` (SECURITY.md). Not pushed beside the image: the registry would list
      # the attestation as the package's newest tag.
      - name: Attest the build's provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: false
          # The storage record is an organisation feature this repository does
          # not use, and it asks for a permission the job does not hold.
          create-storage-record: false

  # A draft release, its notes generated from the commits since the last tag.
  release:
    name: Publish the release
    needs: manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # `gh release create` asks git which repository it is in, and fails with "not a git
      # repository" without a clone. A shallow one does: the notes are generated server-side.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A draft: the notes a person writes for users go above the generated list
          # (CONTRIBUTING.md, "Releasing"). A hyphen marks a pre-release, which moves no tag
          # people follow (`scripts/release-tags.py`), so the page and the image agree on v1.0.0-rc1.
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag --draft $prerelease

  # On publication: `X.Y`, `X` from 1.0 on and `latest` move onto the version the tag
  # published, each when it is the newest of its line (`scripts/release-tags.py`), so a patch
  # of an older minor leaves `latest` on the newest. The tag's image is copied as it is, under
  # the digest its attestation names.
  promote:
    name: Move the tags people follow
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag still names its commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/release-guard.sh --promoting "$REPOSITORY" "$SHA" "$TAG"

      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move them
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          # An assignment, so a failed read fails the step: a process substitution would not.
          moving=$(gh api --paginate "repos/$REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft or .prerelease | not) | .tag_name' |
            python3 scripts/release-tags.py "$TAG")
          if [ -z "$moving" ]; then
            echo "A newer release holds every tag $TAG could take: nothing moves."
            exit 0
          fi
          digest=$(docker buildx imagetools inspect "$image:${TAG#v}" --format '{{json .Manifest}}' | jq -r .digest)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no digest for $image:${TAG#v}"; exit 1; }
          targets=()
          while read -r tag; do
            targets+=(-t "$image:$tag")
          done <<<"$moving"
          # One source, an index: buildx copies it as it is, under the digest attested.
          docker buildx imagetools create "${targets[@]}" "$image@$digest"
          echo "$(tr '\n' ' ' <<<"$moving")now name $image@$digest (${TAG#v})."
