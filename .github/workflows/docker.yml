name: Docker image

# Its own workflow, and that is the whole point.
#
# As a job in `ci.yml`, which cancels a pull request's run when a new push
# supersedes it, a build as long as the image's would be killed before
# finishing on any active day, and the only thing that checks the Dockerfile
# would almost never run to the end.
#
# So: a group that queues rather than cancels. At most one build in flight, at
# most one waiting, and the one in flight finishes.

# Only when something that reaches the image changes. A site or a
# documentation commit cannot break a build that never sees them.
#
# On a pull request as well as on `main`, because nothing in `ci.yml` builds
# the image: a commit touching only the Dockerfile matches none of its three
# path filters, so without this workflow a broken base image would pass every
# check a pull request runs and break `main` on merge, found by whoever merged
# rather than by whoever wrote it. A Rust version whose `-alpine` image is not
# published yet passes every job in `ci.yml` and fails only here.
#
# One list for both events: `pull_request` names the `push` list by its YAML
# anchor. Actions reads anchors and aliases but not the `<<` merge key, so a
# list for one event alone is written out whole, not merged into this one.
on:
  push:
    branches: [main]
    paths: &image-inputs
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/smoke-image.sh'
      - 'scripts/install-runtime.sh'
      # Copied into the image, so a change to it is a change to the image.
      - 'LICENSE'
      - '.github/workflows/docker.yml'
  pull_request:
    paths: *image-inputs

# The job runs a pull request's Dockerfile, so the token it holds reads and
# nothing more.
permissions:
  contents: read

# Queues rather than cancels, as the header says. Keyed on the head branch so
# a pull request and the branch it targets never wait on each other.
concurrency:
  group: docker-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  # Does the image still build and start: natively, on one architecture.
  #
  # Building linux/arm64 here as well would compile it under QEMU, many times
  # longer than every other job put together, on every push that reaches the
  # image.
  #
  # What this job buys is the answer to "does the Dockerfile still work", and
  # one architecture answers that: an arm64-specific break would have to come
  # from a base image or a dependency, not from this repository's code.
  # `release.yml` builds both architectures, where the cost is paid once per tag
  # rather than once per push.
  image:
    name: Docker image (amd64)
    runs-on: ubuntu-latest
    # Native, no emulation. The ceiling catches a stuck build, not a slow one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record carries the event that started the run, the
          # pusher's address included, and an artifact of a public repository
          # is public.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Into the runner's Docker, so the next step can start it.
          load: true
          tags: routarr:smoke
          cache-from: type=gha
          # Written from `main` only. The cache holds 10 GB for the whole
          # repository and evicts the oldest first, so every pull request
          # writing its own layers would push out the layers `release.yml`
          # reads, and a tag would build cold.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # A build that succeeds says the Dockerfile compiles, not that the image
      # runs: the script starts it as the README does and says what it checked.
      - name: Start the image and check it serves
        run: bash scripts/smoke-image.sh routarr:smoke

      # The isolation job starts this same image rather than build its own.
      - name: Keep the image for the isolation job
        run: docker save routarr:smoke | gzip -1 > "$RUNNER_TEMP/routarr-smoke.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routarr-smoke
          path: ${{ runner.temp }}/routarr-smoke.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The README offers gVisor, a kernel in user space, as a line in the compose
  # file. Offered and never run, it could break on a change to the image and
  # nobody would hear of it before a user did. So the image this workflow built
  # goes through the whole smoke test again under it.
  isolation:
    name: Isolated under gVisor
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routarr-smoke
          path: ${{ runner.temp }}

      - name: Load the image
        run: gunzip -c "$RUNNER_TEMP/routarr-smoke.tar.gz" | docker load

      - name: Install gVisor and register it with Docker
        run: sudo bash scripts/install-runtime.sh gvisor

      - name: Start the image under gVisor and check it serves
        env:
          SMOKE_RUNTIME: runsc
        run: bash scripts/smoke-image.sh routarr:smoke
