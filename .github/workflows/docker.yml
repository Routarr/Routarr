name: Docker image

# Its own workflow, and that is the whole point.
#
# As a job in `ci.yml`, which cancels a pull request's run when a new push
# supersedes it, a build as long as the image's would be killed before
# finishing on any active day, and the only thing that checks the Dockerfile
# would almost never run to the end.
#
# So: a group that queues rather than cancels. At most one build in flight, at
# most one waiting, and the one in flight finishes.

# On a pull request as well as on `main`, because nothing in `ci.yml` builds
# the image: a commit touching only the Dockerfile matches none of its three
# areas, so without this workflow a broken base image would pass every check a
# pull request runs and break `main` on merge, found by whoever merged rather
# than by whoever wrote it. A Rust version whose `-alpine` image is not
# published yet passes every job in `ci.yml` and fails only here.
#
# No `paths` filter: a workflow it skips reports no check at all, and a check
# the ruleset requires would then wait forever. The `changes` job runs on every
# commit and skips the image jobs when nothing reaching the image changed, and
# a skipped job satisfies the ruleset.
#
# The dev container's image is built here too, for the same reason: nothing
# else builds it, and a Dependabot bump of its base or a wrong sum among the
# tools it downloads would merge green and break the next person's rebuild.
on:
  push:
    branches: [main]
  pull_request:

# The job runs a pull request's Dockerfile, so the token it holds reads and
# nothing more.
permissions:
  contents: read

# Queues rather than cancels, as the header says. Keyed on the pull request's
# number, not its branch, since two forks can name a branch alike, and on the
# ref for a push to main, so the two never wait on each other.
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  # Whether the commit reaches the image, by `scripts/changed-areas.sh`, as in
  # `ci.yml`. A push to main is compared with the last commit of main whose run
  # of this workflow succeeded, so a failed build leaves the image to the next.
  changes:
    name: What reaches the image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
      devcontainer: ${{ steps.filter.outputs.devcontainer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          else
            base=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/docker.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty' || true)
          fi
          areas=$(bash scripts/changed-areas.sh "$base" "$HEAD")
          printf '%s\n' "$areas" | tee -a "$GITHUB_OUTPUT"
          # An empty answer would skip the build and read green.
          for area in image devcontainer; do
            grep -qxE "$area=(true|false)" <<<"$areas" || { echo "::error::no $area line"; exit 1; }
          done

  # Does the image still build and start: natively, on one architecture.
  #
  # Building linux/arm64 here as well would compile it under QEMU, many times
  # longer than every other job put together, on every push that reaches the
  # image.
  #
  # What this job buys is the answer to "does the Dockerfile still work", and
  # one architecture answers that: an arm64-specific break would have to come
  # from a base image or a dependency, not from this repository's code.
  # `release.yml` builds both architectures, where the cost is paid once per tag
  # rather than once per push.
  image:
    name: Docker image (amd64)
    needs: changes
    if: needs.changes.outputs.image == 'true'
    runs-on: ubuntu-latest
    # Native, no emulation. The ceiling catches a stuck build, not a slow one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit by digest, the version `release.yml` builds with
      # (`check-versions.py`).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record carries the event that started the run, the
          # pusher's address included, and an artifact of a public repository
          # is public.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          platforms: linux/amd64
          # BuildKit's provenance copies that same event into the image and
          # into the log.
          provenance: false
          push: false
          # Into the runner's Docker, so the next step can start it.
          load: true
          tags: routarr:smoke
          cache-from: type=gha
          # Written from `main` only, and read by pull requests and by the
          # amd64 leg of `release.yml`, which a tag can reach and which writes
          # nothing. The cache holds 10 GB for the whole repository and evicts
          # the oldest first, so a pull request writing its own layers would
          # push out main's.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}

      # A build that succeeds says the Dockerfile compiles, not that the image
      # runs: the script starts it as the README does and says what it checked.
      - name: Start the image and check it serves
        run: bash scripts/smoke-image.sh routarr:smoke

      # The isolation job starts this same image rather than build its own.
      - name: Keep the image for the isolation job
        run: docker save routarr:smoke | gzip -1 > "$RUNNER_TEMP/routarr-smoke.tar.gz"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: routarr-smoke
          path: ${{ runner.temp }}/routarr-smoke.tar.gz
          if-no-files-found: error
          retention-days: 1

  # The README offers gVisor, a kernel in user space, as a line in the compose
  # file. Offered and never run, it could break on a change to the image and
  # nobody would hear of it before a user did. So the image this workflow built
  # goes through the whole smoke test again under it.
  isolation:
    name: Isolated under gVisor
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: routarr-smoke
          path: ${{ runner.temp }}

      - name: Load the image
        run: gunzip -c "$RUNNER_TEMP/routarr-smoke.tar.gz" | docker load

      - name: Install gVisor and register it with Docker
        run: sudo bash scripts/install-runtime.sh gvisor

      - name: Start the image under gVisor and check it serves
        env:
          SMOKE_RUNTIME: runsc
        run: bash scripts/smoke-image.sh routarr:smoke

  # The dev container's image, on both architectures it installs for: each tool
  # it downloads is held to one sum per architecture, and only a build on that
  # architecture checks it. Nothing is kept or pushed.
  devcontainer:
    name: Dev container (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.devcontainer == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the dev container
        run: docker build --file .devcontainer/Dockerfile .
