# The Radarr and Sonarr `.github/workflows/live-arrs.yml` drives, as hotio publishes them: the
# Servarr wiki names no image of the projects' own. Pinned by digest, which Dependabot moves with
# the tag. On the host's network, so each Arr reaches the webhook a test serves on the loopback.
#
#   PUID=$(id -u) PGID=$(id -g) LIVE_ARRS_MEDIA=… RADARR_API_KEY=… SONARR_API_KEY=… \
#     docker compose -f scripts/live-arrs/compose.yml up -d
services:
  radarr:
    image: ghcr.io/hotio/radarr:release-6.4.4.10685@sha256:c1d51587b2c86479f2dcfc3f3ccec7f242279ae37a985a095a01c0501438187d
    network_mode: host
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      UMASK: "002"
      TZ: Etc/UTC
      RADARR__AUTH__APIKEY: ${RADARR_API_KEY:?}
    volumes:
      - ${LIVE_ARRS_MEDIA:?}:/media
  sonarr:
    image: ghcr.io/hotio/sonarr:release-4.0.20.3014@sha256:37181160b3d2de46557622564d8a6f5e1ed3ce97d4724194be69a9a5341a97d1
    network_mode: host
    environment:
      PUID: ${PUID:?}
      PGID: ${PGID:?}
      UMASK: "002"
      TZ: Etc/UTC
      SONARR__AUTH__APIKEY: ${SONARR_API_KEY:?}
    volumes:
      - ${LIVE_ARRS_MEDIA:?}:/media
